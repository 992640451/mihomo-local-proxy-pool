name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的 Git 标签，例如 v1.2.0（此处不会创建标签）
        required: true
        type: string
      publish:
        description: 发布 Release 和 GHCR；关闭时仅创建 Draft，不推送镜像
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  TOOLING_REF: ${{ github.sha }}
  RELEASE_NODE_VERSION: 26.8.1

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      matrix: ${{ steps.metadata.outputs.matrix }}
      count: ${{ steps.metadata.outputs.count }}
      revision: ${{ steps.metadata.outputs.revision }}
      built-at: ${{ steps.metadata.outputs.built-at }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Validate release metadata and target matrix
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/validate-release.mjs --root source --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT" --check-remote
      - name: Resolve lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Install, test and build
        working-directory: source
        run: |
          npm ci
          npm test
          npm run build
          cp .env.example .env
          docker compose --env-file .env.example config --quiet

  build-portable:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PPM_BUILD_REVISION: ${{ needs.validate.outputs.revision }}
      PPM_BUILD_TIME: ${{ needs.validate.outputs.built-at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build archive and CycloneDX SBOM
        run: |
          npm --prefix source ci
          npm --prefix source run build
          npm --prefix tooling run portable:package -- --root ../source
      - name: Extract final archive, first start, login, core health, stop and restart
        id: asset
        run: node tooling/scripts/prepare-release-asset.mjs --source-root source --output release-assets --version "${{ needs.validate.outputs.version }}" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --require-verified-core
      - name: Attest archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.asset.outputs.asset }}
      - name: Bind SBOM to archive digest
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.asset.outputs.asset }}
          sbom-path: ${{ steps.asset.outputs.sbom }}
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ steps.asset.outputs.asset }}
            ${{ steps.asset.outputs.sbom }}
            ${{ steps.asset.outputs.metadata }}
          if-no-files-found: error
          retention-days: 7

  container:
    needs: [validate, build-portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.validate.outputs.image }}
      VERSION: ${{ needs.validate.outputs.version }}
      REVISION: ${{ needs.validate.outputs.revision }}
      BUILT_AT: ${{ needs.validate.outputs.built-at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Smoke test both Linux architectures before any push
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load --tag "ppm-smoke:$arch" --build-arg "PPM_BUILD_VERSION=$VERSION" --build-arg "PPM_BUILD_REVISION=$REVISION" --build-arg "PPM_BUILD_TIME=$BUILT_AT" source
            node tooling/scripts/smoke-container.mjs --image "ppm-smoke:$arch" --version "$VERSION" --revision "$REVISION"
          done
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwriting existing version and revision tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: node tooling/scripts/assert-image-unpublished.mjs "$IMAGE:$RELEASE_TAG" "$IMAGE:sha-$REVISION"
      - name: Build multi-architecture image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v7
        with:
          context: source
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:sha-${{ env.REVISION }}
          build-args: |
            PPM_BUILD_VERSION=${{ env.VERSION }}
            PPM_BUILD_REVISION=${{ env.REVISION }}
            PPM_BUILD_TIME=${{ env.BUILT_AT }}
          provenance: mode=max
          sbom: true
      - name: Attest registry image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [validate, build-portable, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLING_REF }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums (archives, SBOMs and build metadata)
        run: node tooling/scripts/create-checksums.mjs --directory release-assets --output release-assets/SHA256SUMS.txt --expected "${{ needs.validate.outputs.count }}"
      - name: Generate release notes
        env:
          RELEASE_IMAGE: ${{ needs.validate.outputs.image }}
          RELEASE_IMAGE_DIGEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && needs.container.outputs.digest || '' }}
        run: node tooling/scripts/extract-release-notes.mjs --root source --tag "$RELEASE_TAG" --output release-notes.md
      - name: Attest checksums and metadata
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG 已发布，拒绝覆盖公开制品。" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft "${flags[@]}"
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
