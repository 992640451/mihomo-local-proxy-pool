name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr-check:
    if: startsWith(github.head_ref || github.ref_name, 'codex/release-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: 检查发布计划与默认分支基线
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/release-github.mjs verify-pr

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare example environment
        run: cp .env.example .env
      - run: docker compose --env-file .env.example config
      - run: docker build -t proxy-port-manager:ci .
      - run: node scripts/smoke-container.mjs --image proxy-port-manager:ci --version "$(node -p 'require("./package.json").version')"

  portable-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npm run portable:build
      - name: Verify distributable without publishing
        shell: bash
        run: node scripts/prepare-release-asset.mjs --source-root . --output .artifacts/ci-assets --version "$(node -p 'require("./package.json").version')" --platform "${{ matrix.platform }}" --arch x64 --require-verified-core
